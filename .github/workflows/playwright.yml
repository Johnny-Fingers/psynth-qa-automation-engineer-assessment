name: Playwright

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start app
        run: docker compose up -d --build

      - name: Wait for app
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/ >/dev/null && curl -sf http://localhost:5173/ >/dev/null; then
              echo "app is up"
              exit 0
            fi
            sleep 2
          done
          echo "app did not become ready"
          docker compose logs
          exit 1

      - name: Select tests for PR
        if: github.event_name == 'pull_request'
        id: select
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"
          SPECS=$(node scripts/select-tests.js $CHANGED)
          echo "Selected specs: $SPECS"
          echo "specs=$SPECS" >> "$GITHUB_OUTPUT"

      - name: Run Playwright (PR, selected tests)
        if: github.event_name == 'pull_request'
        run: npx playwright test ${{ steps.select.outputs.specs }}
        env:
          BASE_URL: http://localhost:5173
          API_URL: http://localhost:8000
          CI: true

      - name: Run Playwright (full suite)
        if: github.event_name != 'pull_request'
        run: npx playwright test
        env:
          BASE_URL: http://localhost:5173
          API_URL: http://localhost:8000
          CI: true

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

      - name: Stop app
        if: always()
        run: docker compose logs && docker compose down
